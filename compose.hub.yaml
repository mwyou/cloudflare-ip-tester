# Published-image deployment. Set CFIP_IMAGE in .env to namespace/repository:version.
services:
  cfst-dns:
    image: "${CFIP_IMAGE:?请先在 .env 填写 Docker Hub 镜像 CFIP_IMAGE}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-8789}:8787"
    env_file:
      - .env
    environment:
      CF_DOMAIN: "${CF_DOMAIN:?请先在 .env 填写优选域名 CF_DOMAIN}"
      DATA_DIR: /data
      CFST_HOME: /opt/cfst
    volumes:
      - cfst-data:/data
      - cfst-bin:/opt/cfst
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  cfst-tools:
    image: "${CFIP_IMAGE:?请先在 .env 填写 Docker Hub 镜像 CFIP_IMAGE}"
    profiles: ["tools"]
    command: ["status"]
    environment:
      DATA_DIR: /data
      CFST_HOME: /opt/cfst
    volumes:
      - cfst-data:/data
      - cfst-bin:/opt/cfst
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  cfst-data:
  cfst-bin:
