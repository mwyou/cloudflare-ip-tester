services:
  cfst-dns:
    image: cotelforce/cloudflare-ip-tester:3.2.0
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8789:8787"
    environment:
      CF_DOMAIN: ""       # 填写完整优选域名
      CF_API_TOKEN: ""    # 填写 Cloudflare API Token
    volumes:
      - cfst-data:/data
      - cfst-bin:/opt/cfst
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  cfst-data:
  cfst-bin:
