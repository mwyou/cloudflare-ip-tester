services:
  cfst-dns:
    image: cotelforce/cloudflare-ip-tester:3.2.7
    container_name: cfst-dns
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "18789:8787"
    environment:
      CF_DOMAIN: ""       # 填写完整优选域名
      CF_API_TOKEN: ""    # 填写 Cloudflare API Token
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
