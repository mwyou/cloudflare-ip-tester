services:
  cfst-dns:
    image: cotelforce/cloudflare-ip-tester:latest
    container_name: cloudflare-ip-tester
    restart: unless-stopped
    ports:
      - "36963:36963"
    environment:
      CF_DOMAIN: ""       # 填写完整优选域名
      CF_API_TOKEN: ""    # 填写 Cloudflare API Token
    volumes:
      - ./data:/data
